packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# Versions shared by more than one workspace. React is pinned to the exact
# version Expo SDK 58 expects, so web and mobile stay identical.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
  typescript: ~6.0.3
  vitest: ^5.0.5
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.18'
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - '@expo/schema-utils@58.0.3'
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - expo@58.0.22
